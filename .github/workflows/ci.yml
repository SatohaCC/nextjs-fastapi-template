name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable pnpm 12
        run: |
          corepack enable
          corepack prepare pnpm@12.18.0 --activate

      - name: Install dependencies (Frontend & Backend)
        run: pnpm install --frozen-lockfile

      - name: Check paths, lint, typecheck & format
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Install Playwright Chromium
        run: pnpm --filter frontend exec playwright install chromium --with-deps

      - name: E2E Test
        run: pnpm test:e2e

      - name: Storybook build and browser test
        run: pnpm test:storybook

      - name: Build
        run: pnpm build
