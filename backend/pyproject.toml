[project]
name = "template-backend"
version = "0.1.0"
description = "FastAPI backend for nextjs-fastapi-template"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "import-linter>=2.1",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"
cache-dir = "../.cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.mypy]
cache_dir = "../.cache/mypy"
mypy_path = [".", "backend"]
explicit_package_bases = true

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Backend layered architecture"
type = "layers"
layers = [
    "app.routers",
    "app.services",
    "app.clients",
]

[[tool.importlinter.contracts]]
name = "Business and adapter layers must not depend on FastAPI"
type = "forbidden"
source_modules = [
    "app.services",
    "app.clients",
    "app.core",
]
forbidden_modules = [
    "fastapi",
]
